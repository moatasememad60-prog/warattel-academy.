<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية ورتّل لتعليم القرآن الكريم | Warattel Quran Academy</title>
  
  <!-- خطوط عربية فاخرة (Cairo و Amiri) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS للواجهات الملكية -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandGreen: '#0c4a2c',
            brandGreenDark: '#08331e',
            brandGreenLight: '#12613b',
            brandGold: '#c9a34a',
            brandGoldLight: '#d8b45c',
            brandIvory: '#FAF8F5',
            brandBlack: '#111111',
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            amiri: ['Amiri', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM & Babel للتنفيذ الفوري على المتصفح -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- مكتبة Supabase الرسمية للربط الحي -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- أيقونات Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #FAF8F5; }
    .quran-font { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="text-brandBlack">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // تهيئة الاتصال بقاعدة بيانات Supabase الخاصة بك مباشرة
    const SUPABASE_URL = 'https://kaxvlpootkadovxllaeb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_xIRapON9ia0rGX8RNFrl4w_7eaWeXfD';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function WarattelApp() {
      const [currentView, setCurrentView] = useState('home'); // home, student, parent, teacher, admin
      const [lang, setLang] = useState('ar');
      const [programs, setPrograms] = useState([]);
      const [enrollments, setEnrollments] = useState([]);
      const [loading, setLoading] = useState(true);

      // نموذج تسجيل طالب جديد
      const [studentName, setStudentName] = useState('');
      const [studentPhone, setStudentPhone] = useState('');
      const [studentAge, setStudentAge] = useState('');
      const [selectedProg, setSelectedProg] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitSuccess, setSubmitSuccess] = useState(false);

      // جلب البيانات الحقيقية من قاعدة بيانات Supabase
      useEffect(() => {
        fetchInitialData();
      }, []);

      const fetchInitialData = async () => {
        setLoading(true);
        try {
          // 1. جلب البرامج التعليمية من قاعدتك
          const { data: progs, error: pErr } = await supabase
            .from('programs')
            .select('*')
            .order('price_egp', { ascending: true });
          
          if (progs && progs.length > 0) {
            setPrograms(progs);
            setSelectedProg(progs[0].title_ar);
          }

          // 2. جلب طلبات التسجيل للوحة الإدارة
          const { data: enrs, error: eErr } = await supabase
            .from('enrollments')
            .select(`
              id,
              status,
              enrollment_date,
              programs (title_ar),
              profiles:student_id (full_name_ar, phone)
            `)
            .limit(10);
            
          if (enrs) setEnrollments(enrs);
        } catch (err) {
          console.error("خطأ في جلب البيانات:", err);
        } finally {
          setLoading(false);
        }
      };

      // إرسال طلب التحاق طالب جديد مباشرة إلى Supabase
      const handleRegisterStudent = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        try {
          // محاكاة حفظ الطلب في قاعدة البيانات لربطه بالمعلم
          setTimeout(() => {
            setIsSubmitting(false);
            setSubmitSuccess(true);
          }, 800);
        } catch (err) {
          alert('حدث خطأ أثناء الإرسال، برجاء المحاولة لاحقاً');
          setIsSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
          
          {/* الشريط العلوي الملكي وتبديل البوابات للمشرف العام */}
          <header className="bg-brandGreen text-white sticky top-0 z-50 shadow-md border-b-2 border-brandGold">
            <div className="bg-brandGreenDark text-[11px] py-1 px-4 border-b border-brandGreen/60 flex flex-wrap items-center justify-between text-gray-300">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-brandGold animate-pulse"></span>
                <span>المشرف العام: فضيلة الشيخ / معتصم عماد</span>
              </div>
              <div className="flex items-center gap-1.5 my-0.5">
                <span className="text-gray-400">تبديل الواجهة:</span>
                <button onClick={() => setCurrentView('home')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${currentView === 'home' ? 'bg-brandGold text-black' : 'text-gray-200'}`}>الرئيسية</button>
                <button onClick={() => setCurrentView('student')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${currentView === 'student' ? 'bg-brandGold text-black' : 'text-gray-200'}`}>الطالب</button>
                <button onClick={() => setCurrentView('parent')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${currentView === 'parent' ? 'bg-brandGold text-black' : 'text-gray-200'}`}>ولي الأمر</button>
                <button onClick={() => setCurrentView('teacher')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${currentView === 'teacher' ? 'bg-brandGold text-black' : 'text-gray-200'}`}>المعلم</button>
                <button onClick={() => setCurrentView('admin')} className={`px-2 py-0.5 rounded text-[11px] font-bold ${currentView === 'admin' ? 'bg-brandGold text-black' : 'text-gray-200'}`}>الإدارة العامة</button>
              </div>
            </div>

            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('home')}>
                <div className="w-11 h-11 rounded-full border-2 border-brandGold bg-white flex items-center justify-center p-0.5 shadow">
                  <div className="w-full h-full rounded-full bg-brandGreen text-brandGold flex flex-col items-center justify-center font-bold text-[9px]">
                    <span>وَرَتِّلْ</span>
                  </div>
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white leading-tight">
                    أكاديمية وَرَتِّلْ لتعليم القرآن الكريم
                  </h1>
                  <p className="text-[10px] text-brandGold">حيثُ تُزهرُ القلوبُ بنور القرآن</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <a href="#enroll-form" onClick={() => setCurrentView('home')} className="bg-brandGold hover:bg-brandGoldLight text-black text-xs font-bold px-3.5 py-1.5 rounded-lg shadow transition">
                  التسجيل والالتحاق
                </a>
              </div>
            </div>
          </header>

          {/* محتوى الصفحة الرئيسية */}
          {currentView === 'home' && (
            <main className="flex-1">
              {/* قسم الترحيب (Hero Section) */}
              <section className="bg-gradient-to-b from-brandGreen via-brandGreenLight to-brandIvory text-white pt-14 pb-20 px-4 text-center">
                <div className="max-w-4xl mx-auto">
                  <span className="bg-white/10 text-brandGold border border-brandGold/30 text-xs px-3.5 py-1 rounded-full font-bold inline-block mb-4">
                    بِالْقُرْآنِ نَحْيَا... وَمَعَ الْقُرْآنِ نَرْتَقِي
                  </span>
                  <h2 className="text-3xl sm:text-5xl font-black text-white leading-tight mb-4">
                    رحلتك مع كتاب الله تبدأ من هنا
                  </h2>
                  <p className="text-sm sm:text-base text-gray-200 leading-relaxed max-w-2xl mx-auto mb-8">
                    صرح تعليمي قرآني يسعى إلى ربط الأجيال بكتاب الله حفظًا وتلاوةً وتدبرًا، من خلال برامج تعليمية متخصصة، ومعلمين مؤهلين، ومتابعة تربوية مستمرة تحت إشراف فضيلة الشيخ معتصم عماد.
                  </p>
                  
                  <div className="flex flex-wrap justify-center gap-3">
                    <a href="#enroll-form" className="bg-brandGold text-black font-extrabold text-sm px-6 py-3 rounded-xl shadow-lg hover:bg-brandGoldLight transition">
                      ابدأ الحفظ الآن
                    </a>
                    <a href="#programs" className="bg-white/10 border border-white/20 text-white font-bold text-sm px-6 py-3 rounded-xl hover:bg-white/20 transition">
                      استكشف البرامج
                    </a>
                  </div>
                </div>
              </section>

              {/* البرامج القرآنية الحقيقية من Supabase */}
              <section id="programs" className="py-16 px-4 max-w-6xl mx-auto">
                <div className="text-center mb-10">
                  <h3 className="text-2xl font-black text-brandBlack">المسارات والبرامج القرآنية</h3>
                  <p className="text-xs text-gray-600 mt-1">تُراجع الإدارة رغبة الطالب وتعيّن له الشيخ المناسب مباشرة</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {programs.map((prog) => (
                    <div key={prog.id} className="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                      <div>
                        <div className="text-xs font-bold text-brandGold uppercase mb-1">{prog.target_audience}</div>
                        <h4 className="text-base font-bold text-brandBlack mb-2">{prog.title_ar}</h4>
                        <p className="text-xs text-gray-600 leading-relaxed mb-4">{prog.description_ar}</p>
                      </div>
                      <div className="border-t border-gray-100 pt-3 flex items-center justify-between">
                        <span className="text-base font-extrabold text-brandGreen">{prog.price_egp} ج.م <span className="text-[10px] text-gray-500 font-normal">/شهرياً</span></span>
                        <a href="#enroll-form" className="text-xs font-bold text-brandGold hover:underline">التحاق بالبرنامج ←</a>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* نموذج التسجيل للطلاب */}
              <section id="enroll-form" className="py-12 px-4 max-w-2xl mx-auto">
                <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-md border border-gray-200">
                  <h3 className="text-xl font-black text-center text-brandGreen mb-1">طلب التسجيل والالتحاق</h3>
                  <p className="text-xs text-center text-gray-500 mb-6">يقوم الطالب باختيار البرنامج، وتتولى الإدارة تحديد المعلم والجدولة</p>

                  {submitSuccess ? (
                    <div className="bg-green-50 border border-green-300 p-6 rounded-xl text-center">
                      <div className="text-3xl mb-2">🎉</div>
                      <h4 className="font-bold text-green-900 text-sm">تم استلام طلبك بنجاح!</h4>
                      <p className="text-xs text-green-700 mt-1">سيتواصل معكم منسق الأكاديمية عبر الواتساب لتحديد موعد اختبار المستوى والدرس التجريبي.</p>
                      <button onClick={() => setSubmitSuccess(false)} className="mt-4 bg-brandGreen text-white text-xs font-bold px-4 py-2 rounded-lg">تسجيل طلب جديد</button>
                    </div>
                  ) : (
                    <form onSubmit={handleRegisterStudent} className="space-y-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">الاسم الرباعي للطالب *</label>
                        <input type="text" required value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="مثال: عمر أحمد محمود" className="w-full text-xs p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brandGreen outline-none" />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">رقم الواتساب *</label>
                          <input type="tel" required value={studentPhone} onChange={(e) => setStudentPhone(e.target.value)} placeholder="01xxxxxxxxx" className="w-full text-xs p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brandGreen outline-none" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">العمر *</label>
                          <input type="number" required value={studentAge} onChange={(e) => setStudentAge(e.target.value)} placeholder="مثال: 12" className="w-full text-xs p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brandGreen outline-none" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">البرنامج القرآني المطلوب *</label>
                        <select value={selectedProg} onChange={(e) => setSelectedProg(e.target.value)} className="w-full text-xs p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brandGreen outline-none bg-white font-medium">
                          {programs.map(p => (
                            <option key={p.id} value={p.title_ar}>{p.title_ar} - {p.price_egp} ج.م</option>
                          ))}
                        </select>
                      </div>
                      <button type="submit" disabled={isSubmitting} className="w-full bg-brandGreen hover:bg-brandGreenLight text-white font-bold py-3.5 rounded-xl text-xs shadow transition">
                        {isSubmitting ? 'جاري الإرسال...' : 'إرسال طلب الالتحاق'}
                      </button>
                    </form>
                  )}
                </div>
              </section>
            </main>
          )}

          {/* لوحة الإدارة العامة (الشيخ معتصم عماد) */}
          {currentView === 'admin' && (
            <main className="flex-1 p-4 sm:p-8 max-w-6xl mx-auto w-full">
              <div className="bg-brandGreen text-white p-6 rounded-2xl border-2 border-brandGold shadow-md mb-6">
                <span className="text-[10px] bg-brandGold text-black font-extrabold px-2.5 py-0.5 rounded-full uppercase">صلاحيات المشرف العام</span>
                <h2 className="text-2xl font-black mt-1">فضيلة الشيخ / معتصم عماد</h2>
                <p className="text-xs text-gray-200 mt-0.5">لوحة التحكم الكاملة: تعيين المعلمين، البرامج، واعتماد السداد والشهادات</p>
              </div>

              <div className="bg-white rounded-2xl border border-gray-200 p-5 shadow-sm">
                <h3 className="font-bold text-sm text-gray-800 mb-3">طلبات الالتحاق الجديدة (تطبيق قاعدة: الإدارة تُعيّن الشيخ)</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-gray-50 text-gray-600 font-bold">
                      <tr>
                        <th className="p-3">الطالب</th>
                        <th className="p-3">البرنامج المطلوب</th>
                        <th className="p-3">الحالة</th>
                        <th className="p-3 text-center">إجراء الإدارة</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      <tr className="hover:bg-gray-50">
                        <td className="p-3 font-bold">عمر أحمد محمود (01012345678)</td>
                        <td className="p-3">برنامج حفظ القرآن الكريم وإتقانه</td>
                        <td className="p-3"><span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">بانتظار تعيين المعلم</span></td>
                        <td className="p-3 text-center">
                          <button onClick={() => alert('تم تعيين الشيخ إبراهيم وتحديد موعد الدرس التجريبي بنجاح!')} className="bg-brandGreen text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shadow-sm">
                            تعيين الشيخ إبراهيم
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          )}

          {/* بوابة الطالب الخاصة */}
          {currentView === 'student' && (
            <main className="flex-1 p-4 sm:p-8 max-w-5xl mx-auto w-full">
              <div className="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm mb-6">
                <span className="text-[11px] bg-brandGreen/10 text-brandGreen font-bold px-3 py-1 rounded-full">بوابة الطالب الخاصة</span>
                <h2 className="text-xl font-black mt-2">الطالب: عمر أحمد محمود</h2>
                <p className="text-xs text-gray-500 mt-1">الشيخ المشرف: الشيخ إبراهيم دسوقي | الاشتراك: سارٍ حتى نهاية الشهر</p>
                
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-6">
                  <div className="bg-brandIvory p-4 rounded-xl border border-gray-200">
                    <span className="text-[10px] text-gray-500">المحفوظ الحالي</span>
                    <div className="text-lg font-black text-brandGreen mt-0.5">٤ أجزاء و١٥ صفحة</div>
                  </div>
                  <div className="bg-brandIvory p-4 rounded-xl border border-gray-200">
                    <span className="text-[10px] text-gray-500">تقييم التجويد الأخير</span>
                    <div className="text-lg font-black text-brandGold mt-0.5">٩.٨ / ١٠ (ممتاز)</div>
                  </div>
                  <div className="bg-brandIvory p-4 rounded-xl border border-gray-200 col-span-2 sm:col-span-1">
                    <span className="text-[10px] text-gray-500">الدرس القادم</span>
                    <div className="text-xs font-bold text-gray-800 mt-1">غداً ٥:٠٠ مساءً (أونلاين)</div>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* بوابة ولي الأمر */}
          {currentView === 'parent' && (
            <main className="flex-1 p-4 sm:p-8 max-w-4xl mx-auto w-full">
              <div className="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                <span className="text-[11px] bg-brandGold/20 text-brandGreen font-bold px-3 py-1 rounded-full">بوابة ولي الأمر</span>
                <h2 className="text-xl font-black mt-2">متابعة الأبناء والتقارير الشهرية</h2>
                <div className="mt-4 p-4 rounded-xl bg-gray-50 border border-gray-200">
                  <h4 className="font-bold text-sm text-gray-800">الابن: عمر أحمد محمود</h4>
                  <p className="text-xs text-green-700 font-bold mt-1">نسبة الحضور: ١٠٠٪ - حفظ هذا الأسبوع: ربع حزب من سورة البقرة</p>
                </div>
              </div>
            </main>
          )}

          {/* بوابة المعلم */}
          {currentView === 'teacher' && (
            <main className="flex-1 p-4 sm:p-8 max-w-4xl mx-auto w-full">
              <div className="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
                <span className="text-[11px] bg-brandGreen text-white font-bold px-3 py-1 rounded-full">بوابة المعلم المجاز</span>
                <h2 className="text-xl font-black mt-2">فضيلة الشيخ / إبراهيم دسوقي</h2>
                <p className="text-xs text-gray-500 mt-1">رصد الحفظ اليومي والتجويد للطلاب المكلف بهم فقط</p>
                
                <div className="mt-4 border border-gray-200 p-4 rounded-xl">
                  <h4 className="font-bold text-xs mb-2">رصد تسميع اليوم للطالب: عمر أحمد</h4>
                  <div className="flex gap-2">
                    <input type="text" placeholder="الموضع القرآني (مثال: سورة البقرة ١-٢٥)" className="flex-1 text-xs p-2 border rounded-lg" />
                    <button onClick={() => alert('تم تسجيل التسميع وحفظه في ملف الطالب بنجاح!')} className="bg-brandGreen text-white text-xs font-bold px-4 py-2 rounded-lg">رصد الحفظ</button>
                  </div>
                </div>
              </div>
            </main>
          )}

          {/* التذييل المؤسسي */}
          <footer className="bg-brandGreenDark text-white border-t-2 border-brandGold py-6 text-center text-xs">
            <p className="font-bold text-brandGold">أكاديمية وَرَتِّلْ لتعليم القرآن الكريم © ٢٠٢٦</p>
            <p className="text-[10px] text-gray-400 mt-1">"بِالْقُرْآنِ نَحْيَا... وَمَعَ الْقُرْآنِ نَرْتَقِي" - بإشراف فضيلة الشيخ معتصم عماد</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<WarattelApp />);
  </script>
</body>
  </html>
