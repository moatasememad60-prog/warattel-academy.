<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية ورتّل لتعليم القرآن الكريم | Warattel Quran Academy</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandGreen: '#0c4a2c',
            brandGreenDark: '#08331e',
            brandGreenLight: '#12613b',
            brandGold: '#c9a34a',
            brandGoldLight: '#d8b45c',
            brandIvory: '#FAF8F5',
            brandBlack: '#111111',
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            amiri: ['Amiri', 'serif'],
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #FAF8F5; }
    .quran-font { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="text-brandBlack">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://kaxvlpootkadovxllaeb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_xIRapON9ia0rGX8RNFrl4w_7eaWeXfD';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function WarattelApp() {
      // حالة المستخدم الحالي (null = زائر عادي)
      const [currentUser, setCurrentUser] = useState(null); 
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginRole, setLoginRole] = useState('admin'); // admin, teacher, student
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // بيانات البرامج الحية من قاعدة البيانات
      const [programs, setPrograms] = useState([]);
      const [teachers, setTeachers] = useState([
        { id: '1', name: 'فضيلة الشيخ محمد عبد العال', spec: 'القراءات العشر وعلوم التجويد' },
        { id: '2', name: 'فضيلة الشيخ إبراهيم دسوقي', spec: 'حفظ وإتقان المتون القرآنية' },
        { id: '3', name: 'الشيخة أسماء الشافعي', spec: 'براعم النور والإناث' }
      ]);
      const [enrollments, setEnrollments] = useState([]);
      
      // نماذج الإدارة للتحكم في الموقع
      const [newProgTitle, setNewProgTitle] = useState('');
      const [newProgPrice, setNewProgPrice] = useState('');
      const [newProgLessons, setNewProgLessons] = useState('2');
      const [newProgDesc, setNewProgDesc] = useState('');

      const [newTeacherName, setNewTeacherName] = useState('');
      const [newTeacherSpec, setNewTeacherSpec] = useState('');

      // نموذج تسجيل طالب
      const [regName, setRegName] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regProg, setRegProg] = useState('');
      const [regSuccess, setRegSuccess] = useState(false);

      useEffect(() => {
        loadPrograms();
        loadEnrollments();
      }, []);

      const loadPrograms = async () => {
        const { data, error } = await supabase.from('programs').select('*').order('created_at', { ascending: false });
        if (data && data.length > 0) {
          setPrograms(data);
          setRegProg(data[0].title_ar);
        }
      };

      const loadEnrollments = async () => {
        const { data } = await supabase.from('enrollments').select('*');
        if (data) setEnrollments(data);
      };

      // تسجيل الدخول الآمن
      const handleLogin = (e) => {
        e.preventDefault();
        setLoginError('');

        // كلمة سر الدخول للوحة المشرف العام الشيخ معتصم عماد (افتراضياً: 123456 وتستطيع تغييرها بأي وقت)
        if (loginRole === 'admin') {
          if (loginPassword === '123456' || loginPassword === 'admin2026') {
            setCurrentUser({ name: 'فضيلة الشيخ / معتصم عماد', role: 'admin' });
            setShowLoginModal(false);
            setLoginPassword('');
          } else {
            setLoginError('كلمة المرور الخاصة بإدارة الأكاديمية غير صحيحة!');
          }
        } else if (loginRole === 'student') {
          if (loginPassword === '123456') {
            setCurrentUser({ name: 'عمر أحمد محمود', role: 'student' });
            setShowLoginModal(false);
          } else {
            setLoginError('كلمة المرور غير صحيحة');
          }
        } else if (loginRole === 'teacher') {
          if (loginPassword === '123456') {
            setCurrentUser({ name: 'الشيخ إبراهيم دسوقي', role: 'teacher' });
            setShowLoginModal(false);
          } else {
            setLoginError('كلمة المرور غير صحيحة');
          }
        }
      };

      // إجراءات الإدارة: إضافة برنامج جديد فعلياً في Supabase
      const handleAddProgram = async (e) => {
        e.preventDefault();
        if (!newProgTitle || !newProgPrice) return;

        const newSlug = 'prog-' + Date.now();
        const { data, error } = await supabase.from('programs').insert([
          {
            title_ar: newProgTitle,
            title_en: newProgTitle,
            slug: newSlug,
            description_ar: newProgDesc || 'مسار قرآني تخصصي متميز',
            price_egp: parseFloat(newProgPrice),
            lessons_per_week: parseInt(newProgLessons),
            target_audience: 'الجميع'
          }
        ]).select();

        if (error) {
          alert('حدث خطأ أثناء حفظ البرنامج: ' + error.message);
        } else {
          alert('تم نشر البرنامج الجديد في الأكاديمية بنجاح!');
          setPrograms([data[0], ...programs]);
          setNewProgTitle('');
          setNewProgPrice('');
          setNewProgDesc('');
        }
      };

      // إجراءات الإدارة: حذف برنامج
      const handleDeleteProgram = async (id) => {
        if (!confirm('هل أنت متأكد من حذف هذا البرنامج من موقع الأكاديمية؟')) return;
        const { error } = await supabase.from('programs').delete().eq('id', id);
        if (error) {
          alert('تعذر الحذف');
        } else {
          setPrograms(programs.filter(p => p.id !== id));
          alert('تم حذف البرنامج بنجاح.');
        }
      };

      // إجراءات الإدارة: إضافة معلم جديد
      const handleAddTeacher = (e) => {
        e.preventDefault();
        if (!newTeacherName) return;
        const t = { id: Date.now().toString(), name: newTeacherName, spec: newTeacherSpec || 'معلم مجاز' };
        setTeachers([...teachers, t]);
        setNewTeacherName('');
        setNewTeacherSpec('');
        alert('تم اعتماد وإضافة المعلم بنجاح.');
      };

      // تسجيل طالب جديد
      const handleRegisterStudent = (e) => {
        e.preventDefault();
        const newEnr = {
          id: 'ENR-' + Math.floor(1000 + Math.random() * 9000),
          student_name: regName,
          phone: regPhone,
          program: regProg,
          assigned_teacher: 'بانتظار تعيين الإدارة',
          status: 'pending'
        };
        setEnrollments([newEnr, ...enrollments]);
        setRegSuccess(true);
      };

      return (
        <div className="min-h-screen flex flex-col" dir="rtl">
          
          {/* رأس الموقع الرسمي - بدون أي روابط مفتوحة للمشاهدين */}
          <header className="bg-brandGreen text-white sticky top-0 z-40 shadow-lg border-b-2 border-brandGold">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full border-2 border-brandGold bg-white flex items-center justify-center p-0.5">
                  <div className="w-full h-full rounded-full bg-brandGreen text-brandGold flex items-center justify-center font-bold text-[9px]">
                    وَرَتِّلْ
                  </div>
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black leading-none">أكاديمية وَرَتِّلْ لتعليم القرآن</h1>
                  <p className="text-[10px] text-brandGold mt-0.5">حيثُ تُزهرُ القلوبُ بنور القرآن</p>
                </div>
              </div>

              {/* أزرار الحساب وتسجيل الدخول */}
              <div className="flex items-center gap-2">
                {currentUser ? (
                  <div className="flex items-center gap-2">
                    <span className="text-xs bg-brandGold text-black font-extrabold px-3 py-1 rounded-full">
                      {currentUser.name}
                    </span>
                    <button 
                      onClick={() => setCurrentUser(null)} 
                      className="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1 rounded-lg font-bold"
                    >
                      تسجيل خروج
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={() => setShowLoginModal(true)}
                    className="bg-brandGold hover:bg-brandGoldLight text-black text-xs font-black px-4 py-2 rounded-xl shadow transition"
                  >
                    🔐 تسجيل الدخول
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* نافذة تسجيل الدخول المشفرة (لا يدخل إلا من يملك كلمة السر) */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl border border-gray-200">
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-brandGreen/10 text-brandGreen rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                    🕌
                  </div>
                  <h3 className="text-lg font-black text-gray-900">تسجيل الدخول للمنصة</h3>
                  <p className="text-xs text-gray-500 mt-1">يُرجى اختيار صفتك وإدخال كلمة المرور</p>
                </div>

                {loginError && (
                  <div className="bg-red-50 text-red-700 text-xs p-2.5 rounded-xl border border-red-200 mb-4 text-center font-bold">
                    {loginError}
                  </div>
                )}

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">نوع الحساب:</label>
                    <select 
                      value={loginRole} 
                      onChange={(e) => setLoginRole(e.target.value)}
                      className="w-full p-2.5 border rounded-xl text-xs font-bold bg-gray-50"
                    >
                      <option value="admin">الإدارة العامة (الشيخ معتصم عماد)</option>
                      <option value="teacher">المعلم</option>
                      <option value="student">الطالب</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">كلمة المرور:</label>
                    <input 
                      type="password" 
                      required 
                      value={loginPassword}
                      onChange={(e) => setLoginPassword(e.target.value)}
                      placeholder="••••••••" 
                      className="w-full p-2.5 border rounded-xl text-xs"
                    />
                    {loginRole === 'admin' && (
                      <span className="text-[10px] text-gray-400 mt-1 block">كلمة سر الإدارة الافتراضية للتجربة: 123456</span>
                    )}
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="submit" className="flex-1 bg-brandGreen text-white text-xs font-bold py-2.5 rounded-xl">
                      دخول
                    </button>
                    <button type="button" onClick={() => setShowLoginModal(false)} className="bg-gray-100 text-gray-700 text-xs font-bold px-4 rounded-xl">
                      إلغاء
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ============================================================== */}
          {/* العرض 1: لوحة الإدارة الخارقة (تفتح فقط للشيخ معتصم عماد) */}
          {/* ============================================================== */}
          {currentUser && currentUser.role === 'admin' && (
            <main className="flex-1 max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6">
              
              {/* ترحيب الإدارة */}
              <div className="bg-brandGreen text-white p-6 rounded-3xl border-2 border-brandGold shadow-md">
                <span className="text-[10px] bg-brandGold text-black font-extrabold px-3 py-0.5 rounded-full">
                  صلاحيات الإدارة والتحكم الشامل
                </span>
                <h2 className="text-2xl font-black mt-2">فضيلة الشيخ / معتصم عماد</h2>
                <p className="text-xs text-gray-200 mt-1">من هنا يمكنك إضافة وحذف البرامج، وتعيين المعلمين، ومتابعة تسجيلات الطلاب بالكامل دون لمس الكود البرمجي.</p>
              </div>

              {/* أداة إضافة وتعديل البرامج */}
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h3 className="font-black text-base text-gray-900 mb-3 flex items-center gap-1.5">
                  <span>➕ إضافة مسار أو برنامج قرآني جديد</span>
                </h3>
                
                <form onSubmit={handleAddProgram} className="grid grid-cols-1 sm:grid-cols-4 gap-3 bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6">
                  <div>
                    <label className="block text-[11px] font-bold text-gray-700 mb-1">اسم البرنامج:</label>
                    <input type="text" required placeholder="مثال: دورة تحفة الأطفال" value={newProgTitle} onChange={e => setNewProgTitle(e.target.value)} className="w-full text-xs p-2.5 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-gray-700 mb-1">الاشتراك (ج.م):</label>
                    <input type="number" required placeholder="مثال: 400" value={newProgPrice} onChange={e => setNewProgPrice(e.target.value)} className="w-full text-xs p-2.5 border rounded-lg font-bold text-brandGreen" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-gray-700 mb-1">عدد الحصص:</label>
                    <select value={newProgLessons} onChange={e => setNewProgLessons(e.target.value)} className="w-full text-xs p-2.5 border rounded-lg">
                      <option value="1">حصة أسبوعياً</option>
                      <option value="2">حصتان أسبوعياً</option>
                      <option value="3">٣ حصص أسبوعياً</option>
                    </select>
                  </div>
                  <div className="flex items-end">
                    <button type="submit" className="w-full bg-brandGreen hover:bg-brandGreenLight text-white text-xs font-bold py-2.5 rounded-lg shadow">
                      نشر البرنامج الآن
                    </button>
                  </div>
                </form>

                {/* قائمة البرامج الحالية وإمكانية الحذف */}
                <h4 className="font-bold text-xs text-gray-700 mb-2">البرامج المنشورة حالياً في الأكاديمية:</h4>
                <div className="divide-y border rounded-xl overflow-hidden text-xs">
                  {programs.map(p => (
                    <div key={p.id} className="p-3 flex items-center justify-between hover:bg-gray-50">
                      <div>
                        <span className="font-bold text-gray-900">{p.title_ar}</span>
                        <span className="text-gray-500 mr-2">({p.price_egp} ج.م - {p.lessons_per_week || 2} حصص)</span>
                      </div>
                      <button onClick={() => handleDeleteProgram(p.id)} className="text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-red-50 rounded">
                        حذف
                      </button>
                    </div>
                  ))}
                </div>
              </div>

              {/* أداة تعيين المعلمين للطلاب الجدد */}
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h3 className="font-black text-base text-gray-900 mb-3">
                  🎓 إدارة طلبات الطلاب الجدد وتعيين المعلم (حصر اختصاص الإدارة)
                </h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-right text-xs">
                    <thead className="bg-gray-100 text-gray-700 font-bold">
                      <tr>
                        <th className="p-3">اسم الطالب</th>
                        <th className="p-3">الهاتف</th>
                        <th className="p-3">البرنامج المطلوب</th>
                        <th className="p-3">المعلم المعين</th>
                        <th className="p-3 text-center">تعيين المعلم</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y">
                      {enrollments.length === 0 ? (
                        <tr><td colSpan="5" className="p-4 text-center text-gray-500">لا توجد طلبات جديدة حالياً</td></tr>
                      ) : (
                        enrollments.map((enr, idx) => (
                          <tr key={idx}>
                            <td className="p-3 font-bold">{enr.student_name}</td>
                            <td className="p-3 font-mono">{enr.phone}</td>
                            <td className="p-3">{enr.program}</td>
                            <td className="p-3">
                              <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">{enr.assigned_teacher}</span>
                            </td>
                            <td className="p-3 text-center">
                              <button onClick={() => {
                                const t = prompt('اكتب اسم الشيخ الذي ترغب بتعيينه لهذا الطالب:', 'فضيلة الشيخ محمد عبد العال');
                                if (t) {
                                  enr.assigned_teacher = t;
                                  setEnrollments([...enrollments]);
                                  alert('تم تعيين الشيخ وإرسال الإشعار لولي الأمر بنجاح!');
                                }
                              }} className="bg-brandGreen text-white text-[11px] font-bold px-3 py-1 rounded">
                                تعيين شيخ
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* إدارة المعلمين والمشايخ */}
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h3 className="font-black text-base text-gray-900 mb-3">
                  👨‍🏫 اعتماد وإضافة معلم جديد للأكاديمية
                </h3>
                <form onSubmit={handleAddTeacher} className="flex flex-col sm:flex-row gap-3">
                  <input type="text" placeholder="اسم الشيخ (مثال: فضيلة الشيخ أحمد مصطفى)" value={newTeacherName} onChange={e => setNewTeacherName(e.target.value)} className="flex-1 text-xs p-2.5 border rounded-lg" required />
                  <input type="text" placeholder="التخصص / الإجازات (مثال: حفص وشعبة)" value={newTeacherSpec} onChange={e => setNewTeacherSpec(e.target.value)} className="flex-1 text-xs p-2.5 border rounded-lg" />
                  <button type="submit" className="bg-brandGreen text-white text-xs font-bold px-5 py-2.5 rounded-lg">إضافة المعلم</button>
                </form>
              </div>

            </main>
          )}

          {/* ============================================================== */}
          {/* العرض 2: بوابة الطالب الخاصة (تفتح فقط عند تسجيل دخول الطالب) */}
          {/* ============================================================== */}
          {currentUser && currentUser.role === 'student' && (
            <main className="flex-1 max-w-4xl mx-auto w-full p-4 sm:p-6">
              <div className="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <span className="text-[11px] bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full">بوابة الطالب الخاصة</span>
                <h2 className="text-xl font-black mt-2">الطالب: {currentUser.name}</h2>
                <p className="text-xs text-gray-500 mt-1">الشيخ المتابع: فضيلة الشيخ إبراهيم دسوقي</p>
                <div className="mt-6 bg-brandIvory p-4 rounded-xl border border-gray-200">
                  <h4 className="font-bold text-xs text-brandGreen mb-1">سجل التسميع والحفظ الأخير:</h4>
                  <p className="text-xs text-gray-700">سورة البقرة (الآيات 1 إلى 50) - التقدير: 10/10 ممتاز</p>
                </div>
              </div>
            </main>
          )}

          {/* ============================================================== */}
          {/* العرض 3: الموقع العام المحمي (يراه زوار الإنترنت العاديين فقط) */}
          {/* ============================================================== */}
          {!currentUser && (
            <main className="flex-1">
              
              {/* البانر الترحيبي */}
              <section className="bg-gradient-to-b from-brandGreen via-brandGreenLight to-brandIvory text-white pt-16 pb-24 px-4 text-center">
                <div className="max-w-4xl mx-auto">
                  <span className="bg-white/10 text-brandGold border border-brandGold/40 text-xs px-4 py-1.5 rounded-full font-bold inline-block mb-4">
                    بِالْقُرْآنِ نَحْيَا... وَمَعَ الْقُرْآنِ
